[package]
name = "starship-jj"
version = "1.0.1"
description = "starship plugin for jj"
resolver = "3"
edition = "2024"
authors = ["Lilly Mannhal <lilly.mannhal@gmail.com>", "Chris Cummings <chris@thesogu.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://git.sr.ht/~averagechris/starship-jj"
repository = "https://git.sr.ht/~averagechris/starship-jj"
keywords = [
  "command-line-tool",
  "jj",
  "jujutsu",
  "prompt",
  "starship",
]
categories = ["command-line-utilities"]

[lints]

[features]
default = []
json-schema = ["dep:schemars", "dep:serde_json"]
# Optional: enable .env loading in dev or ad-hoc runs
dotenv = ["dep:dotenvy"]
 
[dependencies]
unicode-width = "0.2.1"
jj-lib = "0.44.0"
jj-cli = "0.44.0"
clap = { version = "4.6.5", features = ["env"] }
etcetera = "0.11.0"
glob = "0.3.4"
dotenvy = { version = "0.15", optional = true }
toml = "1.1.4"
pollster = "1.0.1"
futures-util = "0.3.33"
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tinytemplate = "1.2.1"
 
[build-dependencies]
built={version="0.8", features=["git2"]}

[profile.release]
# thin LTO with default codegen-units: fat LTO + codegen-units=1 gets the
# jj-lib compile OOM-killed on the small sr.ht builder (jobs 1814542/1814553).
lto = "thin"
strip = "symbols"
opt-level = "s"
panic = "abort"

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
regex = "1.13.1"
which = "8.0.5"
