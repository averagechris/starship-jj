image: nixos/unstable
arch: x86_64
environment:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/starship-jj
secrets:
  - 5ec60320-e0d8-4ebe-8b45-1d10cc4d2cb2 # cachix averagechris-dotfiles -> ~/.ci_secrets/cachix_token
tasks:
  - static-checks: cd starship-jj && nix run .#static-checks
  - test: cd starship-jj && nix run .#ci-test
  - package: |
      cd starship-jj
      # Reclaim the cargo debug artifacts from the check tasks first: the
      # builder disk is too small to hold target/ plus the nix build
      # (job 1814375 died with ENOSPC while vendoring).
      rm -rf target ~/.cargo
      # Reclaim everything unrooted in the nix store too (ci-app closures,
      # unpacked nixpkgs sources, tarball caches): job 1814606 got within a
      # final artifact copy of fitting. The package build re-substitutes
      # what it needs from cachix/cache.nixos.org.
      nix store gc
      df -h /
      nix build .#starship-jj --print-build-logs
  - closure-size: |
      cd starship-jj
      nix path-info -S ./result
      nix path-info -rS ./result | sort -k2 -n | tail -n 5
  - cache-warm: |
      cd starship-jj
      if [ ! -f ~/.ci_secrets/cachix_token ]; then
        echo "no cachix token available; skipping cache warm"
        exit 0
      fi
      set +x
      CACHIX_AUTH_TOKEN="$(cat ~/.ci_secrets/cachix_token)"
      export CACHIX_AUTH_TOKEN
      set -x
      nix run --inputs-from . nixpkgs#cachix -- push averagechris-dotfiles ./result
